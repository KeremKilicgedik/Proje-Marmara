name: Proje görevi
description: Yapacağımız işi ve bitirme ölçütünü yazalım.
title: "[Görev] "
body:
  - type: textarea
    id: yapilacak
    attributes:
      label: Ne yapacağız?
      description: İşi ve neden gerekli olduğunu kısaca yazın.
    validations:
      required: true
  - type: textarea
    id: kontrol
    attributes:
      label: Bittiğini nasıl anlayacağız?
      description: Deneyeceğimiz adımları veya beklenen çıktıyı yazın.
    validations:
      required: true
  - type: input
    id: sorumlu
    attributes:
      label: Kim ilgileniyor?
  - type: textarea
    id: sonuc
    attributes:
      label: Sonuç ve kalan işler
      description: İş ilerledikçe kontrol sonucunu ve ilgili commit bağlantısını ekleyin.
