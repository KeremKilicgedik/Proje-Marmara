<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="640" viewBox="0 0 1060 640" role="img" aria-labelledby="title desc">
<title id="title">Yapay zekâ kullanım karşılaştırma uygulaması kullanım durumları</title>
<desc id="desc">Ziyaretçi anket ve sonuç ekranlarını kullanır. Ekip referans veriyi geliştirme aşamasında hazırlar.</desc>
<rect width="1060" height="640" fill="white"/>
<g font-family="Arial, sans-serif" font-size="16" fill="#172033" stroke="#233c61">
<rect x="250" y="35" width="560" height="560" rx="8" fill="#f5f7fb"/>
<text x="530" y="65" text-anchor="middle" stroke="none" font-weight="bold">AI kullanım karşılaştırma uygulaması</text>
<circle cx="115" cy="220" r="16" fill="white"/>
<path d="M115,236v48m-28,-30h56m-28,30l-24,34m24,-34l24,34" fill="none" stroke-width="2"/>
<text x="115" y="345" text-anchor="middle" stroke="none">Ziyaretçi</text>
<circle cx="940" cy="415" r="16" fill="white"/>
<path d="M940,431v48m-28,-30h56m-28,30l-24,34m24,-34l24,34" fill="none" stroke-width="2"/>
<text x="940" y="540" text-anchor="middle" stroke="none">Ekip üyesi</text>
<ellipse cx="530" cy="115" rx="240" ry="28" fill="white"/>
<text x="530" y="121" text-anchor="middle" stroke="none">UC-01 Kaynak ve gizliliği incele</text>
<line x1="145" y1="255" x2="290" y2="115"/>
<ellipse cx="530" cy="195" rx="240" ry="28" fill="white"/>
<text x="530" y="201" text-anchor="middle" stroke="none">UC-02 Anketi doldur ve doğrula</text>
<line x1="145" y1="255" x2="290" y2="195"/>
<ellipse cx="530" cy="275" rx="240" ry="28" fill="white"/>
<text x="530" y="281" text-anchor="middle" stroke="none">UC-03 Profil ve karşılaştırmayı gör</text>
<line x1="145" y1="255" x2="290" y2="275"/>
<ellipse cx="530" cy="355" rx="240" ry="28" fill="white"/>
<text x="530" y="361" text-anchor="middle" stroke="none">UC-04 Temizle ve yeniden başla</text>
<line x1="145" y1="255" x2="290" y2="355"/>
<ellipse cx="530" cy="435" rx="240" ry="28" fill="white"/>
<text x="530" y="441" text-anchor="middle" stroke="none">UC-05 Araştırmayı incele</text>
<line x1="145" y1="255" x2="290" y2="435"/>
<ellipse cx="530" cy="515" rx="240" ry="28" fill="white"/>
<text x="530" y="521" text-anchor="middle" stroke="none">UC-06 Referans paketi hazırla</text>
<line x1="910" y1="450" x2="770" y2="515"/>
</g></svg>